# /root/bali5.0/redis.conf
# BALI 5.0 — Redis server configuration (Unix socket, no TCP)

unixsocket /root/bali5.0/redis.sock
unixsocketperm 770
port 0

daemonize yes
maxmemory 0
maxmemory-policy noeviction
save ""
appendonly no
tcp-keepalive 60
hz 20
loglevel notice
logfile /root/bali5.0/logs/redis-server.log
